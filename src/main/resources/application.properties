spring.application.name=safebeat

# Database configuration
spring.datasource.url=${SAFEBEAT_JDBC_URL:jdbc:postgresql://localhost:5432/safebeat}
spring.datasource.username=${SAFEBEAT_DB_USERNAME:postgres}
spring.datasource.password=${SAFEBEAT_DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SafeBeat demonstration rules; not clinical thresholds
safebeat.rules.minimum-heart-rate=50
safebeat.rules.maximum-heart-rate=120
safebeat.rules.minimum-oxygen-saturation=92
safebeat.rules.maximum-reading-age-seconds=120

server.port=${PORT:8080}
